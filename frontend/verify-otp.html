<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - OTP | AS³Cosmetic</title>
    <meta name="description" content="Verify your email with OTP - Premium cosmetics shopping">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verification-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .icon-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }

        .email-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .verification-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .verification-info h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .verification-info p {
            color: #666;
            line-height: 1.6;
        }

        .user-email {
            color: #667eea;
            font-weight: bold;
        }

        .otp-input-section {
            margin-bottom: 20px;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        .otp-input:focus {
            border-color: #667eea;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
        }

        .timer {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .timer.expired {
            color: #dc3545;
        }

        .resend-section {
            text-align: center;
            margin-top: 20px;
        }

        .resend-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .resend-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .verification-container {
                padding: 30px 20px;
            }

            .otp-input {
                width: 45px;
                height: 55px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="verification-container">
        <div class="logo">
            <h1>🌟 AS<span>3</span>Cosmetic</h1>
            <p>Premium Cosmetics</p>
        </div>

        <div class="icon-wrapper">
            <div class="email-icon">📧</div>
        </div>

        <div class="verification-info">
            <h2>Verify Your Email</h2>
            <p>We've sent a 6-digit OTP to<br><span class="user-email" id="userEmail">Loading...</span></p>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="otp-input-section">
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" id="otp1" autofocus>
                <input type="text" class="otp-input" maxlength="1" id="otp2">
                <input type="text" class="otp-input" maxlength="1" id="otp3">
                <input type="text" class="otp-input" maxlength="1" id="otp4">
                <input type="text" class="otp-input" maxlength="1" id="otp5">
                <input type="text" class="otp-input" maxlength="1" id="otp6">
            </div>

            <div class="timer" id="timer">OTP expires in: <strong>10:00</strong></div>

            <button class="btn btn-primary" id="verifyBtn" onclick="verifyOTP()">
                Verify Email ✨
            </button>
        </div>

        <div class="resend-section">
            <p>Didn't receive the code?</p>
            <a href="#" class="resend-link" id="resendLink" onclick="resendOTP(event)">Resend OTP</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let otpExpiry = Date.now() + (10 * 60 * 1000); // 10 minutes
        let timerInterval;

        // Get user email from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const userEmail = localStorage.getItem('verificationEmail');
            const userId = localStorage.getItem('verificationUserId');

            if (!userEmail) {
                showAlert('No email found. Please register first.', 'error');
                setTimeout(() => {
                    window.location.href = 'register.html';
                }, 2000);
                return;
            }

            document.getElementById('userEmail').textContent = userEmail;
            startTimer();
        });

        // OTP Input Auto-focus
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Only allow numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Timer Function
        function startTimer() {
            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = otpExpiry - now;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').innerHTML = '<strong>OTP Expired!</strong>';
                    document.getElementById('timer').classList.add('expired');
                    document.getElementById('verifyBtn').disabled = true;
                    showAlert('OTP has expired. Please request a new one.', 'error');
                    return;
                }

                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('timer').innerHTML =
                    `OTP expires in: <strong>${minutes}:${seconds.toString().padStart(2, '0')}</strong>`;
            }, 1000);
        }

        // Verify OTP
        async function verifyOTP() {
            const otp = Array.from(otpInputs).map(input => input.value).join('');

            if (otp.length !== 6) {
                showAlert('Please enter the complete 6-digit OTP', 'error');
                return;
            }

            const email = localStorage.getItem('verificationEmail');
            const verifyBtn = document.getElementById('verifyBtn');

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = 'Verifying... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(data.message, 'success');

                    // Store token
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // Clear verification data
                    localStorage.removeItem('verificationEmail');
                    localStorage.removeItem('verificationUserId');

                    // Redirect to home
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showAlert(data.message, 'error');
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = 'Verify Email ✨';
                }
            } catch (error) {
                console.error('Verification error:', error);
                showAlert('Network error. Please try again.', 'error');
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = 'Verify Email ✨';
            }
        }

        // Resend OTP
        async function resendOTP(event) {
            event.preventDefault();

            const email = localStorage.getItem('verificationEmail');
            const resendLink = document.getElementById('resendLink');

            resendLink.style.pointerEvents = 'none';
            resendLink.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_URL}/auth/resend-otp`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(data.message, 'success');

                    // Reset timer
                    clearInterval(timerInterval);
                    otpExpiry = Date.now() + (10 * 60 * 1000);
                    document.getElementById('timer').classList.remove('expired');
                    document.getElementById('verifyBtn').disabled = false;
                    startTimer();

                    // Clear OTP inputs
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                } else {
                    showAlert(data.message, 'error');
                }
            } catch (error) {
                console.error('Resend error:', error);
                showAlert('Network error. Please try again.', 'error');
            } finally {
                resendLink.style.pointerEvents = 'auto';
                resendLink.textContent = 'Resend OTP';
            }
        }

        // Show Alert
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyOTP();
            }
        });
    </script>
</body>

</html>
