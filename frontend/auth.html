<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - AS³Cosmetic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 50%, #1a1a2e 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Circles */
        .auth-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(252, 39, 121, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }

        .auth-container::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50px, 50px) scale(1.1);
            }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            padding: 50px 45px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 100px rgba(252, 39, 121, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #fc2779 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .auth-logo p {
            color: #666;
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 35px;
            background: #f8f9fa;
            border-radius: 50px;
            padding: 5px;
            position: relative;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 14px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            border-radius: 50px;
            position: relative;
            z-index: 2;
        }

        .auth-tab.active {
            color: white;
            background: linear-gradient(135deg, #fc2779 0%, #ff5e9e 100%);
            box-shadow: 0 4px 15px rgba(252, 39, 121, 0.4);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #1a1a2e;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #fc2779;
            outline: none;
            box-shadow: 0 0 0 4px rgba(252, 39, 121, 0.1);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #fc2779 0%, #ff5e9e 50%, #ffd700 100%);
            background-size: 200% 100%;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(252, 39, 121, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .auth-btn:hover::before {
            left: 100%;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(252, 39, 121, 0.6);
            background-position: 100% 0;
        }

        .auth-btn:active {
            transform: translateY(-1px);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: #fc2779;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .auth-footer a:hover {
            color: #d91f5e;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #f0f0f0;
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .secondary-btn {
            background: white !important;
            color: #1a1a2e !important;
            border: 2px solid #e8e8e8 !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
        }

        .secondary-btn:hover {
            border-color: #fc2779 !important;
            background: #fef9f3 !important;
            box-shadow: 0 8px 25px rgba(252, 39, 121, 0.15) !important;
        }

        .otp-section {
            background: linear-gradient(135deg, #fff5f8 0%, #fef9f3 100%);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 2px solid rgba(252, 39, 121, 0.1);
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.2);
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
        }

        .back-home a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 35px 25px;
            }

            .auth-logo h1 {
                font-size: 2.2rem;
            }

            .back-home {
                top: 15px;
                left: 15px;
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: particleFloat 10s infinite;
        }

        @keyframes particleFloat {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <!-- Back to Home Button -->
        <div class="back-home">
            <a href="./index.html">
                <span>←</span> Back to Home
            </a>
        </div>

        <div class="auth-card">
            <div class="auth-logo">
                <a href="./index.html" style="text-decoration: none;">
                    <h1>AS³Cosmetic</h1>
                </a>
                <p>Your gateway to premium beauty</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('register')">Create Account</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
                <div class="auth-footer">
                    <a href="#">Forgot Password?</a>
                </div>
                <div class="divider"><span>New to AS³Cosmetic?</span></div>
                <button type="button" class="auth-btn secondary-btn" onclick="switchTab('register')">Create your
                    Account</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-input" id="regName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="name@example.com" required>
                    <small style="color: #666; font-size: 0.85rem; display: block; margin-top: 5px;">
                        📧 You'll receive an OTP to verify your email
                    </small>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="At least 6 characters"
                        required minlength="6">
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">
                    By creating an account, you agree to AS³Cosmetic's <a href="#">Conditions of Use</a> and <a
                        href="#">Privacy Notice</a>.
                </p>
                <button type="submit" class="auth-btn">Create Account & Send OTP</button>
                <div class="auth-footer">
                    Already have an account? <a href="#" onclick="switchTab('login')">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const LIVE_API = 'https://cosmetics-website-1.onrender.com/api';
        const API_URL = (['localhost', '127.0.0.1', '::1'].includes(window.location.hostname) || window.location.hostname.startsWith('192.168.'))
            ? `http://${window.location.hostname || 'localhost'}:5000/api`
            : (window.location.protocol === 'file:' ? LIVE_API : '/api');

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const loginBtn = e.target.querySelector('.auth-btn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    localStorage.setItem('token', data.data.token);

                    if (data.data.user.role === 'admin') {
                        localStorage.setItem('isAdmin', 'true');
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    alert(data.message);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Login failed. Check connection.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Handle Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const registerBtn = e.target.querySelector('.auth-btn');
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();
                if (data.success) {
                    // Store email for verification page
                    localStorage.setItem('verificationEmail', data.data.email);
                    localStorage.setItem('verificationUserId', data.data.userId);

                    // Show success message
                    alert('✅ ' + data.message);

                    // Redirect to OTP verification page
                    window.location.href = 'verify-otp.html';
                } else {
                    alert(data.message);
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Create Account & Send OTP';
                }
            } catch (err) {
                console.error('Registration error:', err);
                alert('Registration failed: ' + err.message + '\nPlease check console for details.');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account & Send OTP';
            }
        });
    </script>
</body>

</html>
