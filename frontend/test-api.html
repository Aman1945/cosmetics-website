<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Debugger</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #000;
            color: #0f0;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
        }

        .success {
            color: #0f0;
            border-color: #0f0;
        }

        .error {
            color: #f00;
            border-color: #f00;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>🔌 API Connection Debugger</h1>
    <p>Backend URL: <b id="apiUrl">Loading...</b></p>
    <button onclick="runTests()">RUN DIAGNOSTICS</button>

    <div id="results"></div>

    <script>
        const LIVE_API = 'https://cosmetics-website-1.onrender.com/api';

        document.getElementById('apiUrl').textContent = LIVE_API;

        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing...';

            log('1. Testing Connection to Backend Root...', 'app');
            try {
                const start = Date.now();
                const res = await fetch(`${LIVE_API}/products`);
                const time = Date.now() - start;

                if (res.ok) {
                    const data = await res.json();
                    log(`✅ SUCCESS: Connected in ${time}ms`, 'success');
                    log(`📦 Found ${data.data?.products?.length || 0} products`, 'success');
                } else {
                    log(`❌ FAILED: Server responded with status ${res.status}`, 'error');
                }
            } catch (err) {
                log(`❌ CRITICAL ERROR: Could not connect to backend.`, 'error');
                log(`   Error: ${err.message}`, 'error');
                log(`   Possible Causes:`, 'error');
                log(`   1. CORS Blocked (Check Console F12)`, 'error');
                log(`   2. Backend is Sleeping/Down (Render spins down free servers)`, 'error');
            }
        }

        function log(msg, type) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            document.getElementById('results').appendChild(div);
        }
    </script>
</body>

</html>
