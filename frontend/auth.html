<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - AS³Cosmetic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            padding: 20px;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #1a1a2e;
        }

        .auth-logo h1 span {
            color: #fc2779;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #fc2779;
            border-bottom: 2px solid #fc2779;
            margin-bottom: -2px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: #fc2779;
            outline: none;
            box-shadow: 0 0 0 4px rgba(252, 39, 121, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #fc2779, #ff5e9e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(252, 39, 121, 0.3);
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #fc2779;
            text-decoration: none;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #ccc;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider span {
            padding: 0 10px;
            font-size: 0.85rem;
        }

        .otp-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .otp-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #fc2779, #ff5e9e);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/" style="text-decoration: none;">
                    <h1>AS<span>3</span>Cosmetic</h1>
                </a>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('register')">Create Account</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
                <div class="auth-footer">
                    <a href="#">Forgot Password?</a>
                </div>
                <div class="divider"><span>New to AS³Cosmetic?</span></div>
                <button type="button" class="auth-btn"
                    style="background: white; color: #333; border: 2px solid #f0f0f0;"
                    onclick="switchTab('register')">Create your Account</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <!-- OTP Verification Section -->
                <div class="otp-section">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label>Mobile Number (Required for Registration)</label>
                        <input type="tel" class="form-input" id="regPhone" placeholder="10-digit mobile" maxlength="10"
                            required>
                    </div>
                    <button type="button" class="otp-btn" id="sendOtpBtn" onclick="sendOTP()">Verify Mobile</button>
                    <div id="otpVerified" style="display: none;" class="verified-badge">
                        ✅ Mobile Verified
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-input" id="regName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="At least 6 characters"
                        required minlength="6">
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">
                    By creating an account, you agree to AS³Cosmetic's <a href="#">Conditions of Use</a> and <a
                        href="#">Privacy Notice</a>.
                </p>
                <button type="submit" class="auth-btn" id="registerBtn" disabled>Create Account</button>
                <div class="auth-footer">
                    Already have an account? <a href="#" onclick="switchTab('login')">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://cosmetics-website-1.onrender.com/api';
        let mobileVerified = false;

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // OTP System
        async function sendOTP() {
            const phone = document.getElementById('regPhone').value;
            if (phone.length !== 10) {
                alert('Please enter a valid 10-digit mobile number');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const data = await res.json();
                if (data.success) {
                    const otp = prompt(`Demo Mode: Your OTP is ${data.demo_otp}\n\nEnter OTP to verify:`);
                    if (otp) {
                        await verifyOTP(phone, otp);
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Failed to send OTP');
            }
        }

        async function verifyOTP(phone, otp) {
            try {
                const res = await fetch(`${API_URL}/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, otp })
                });

                const data = await res.json();
                if (data.success) {
                    mobileVerified = true;
                    document.getElementById('otpVerified').style.display = 'inline-flex';
                    document.getElementById('sendOtpBtn').disabled = true;
                    document.getElementById('sendOtpBtn').textContent = '✓ Verified';
                    document.getElementById('regPhone').disabled = true;
                    document.getElementById('registerBtn').disabled = false;
                    alert('Mobile verified successfully!');
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Verification failed');
            }
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    localStorage.setItem('token', data.data.token);

                    if (data.data.user.role === 'admin') {
                        localStorage.setItem('isAdmin', 'true');
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Login failed. Check connection.');
            }
        });

        // Handle Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!mobileVerified) {
                alert('Please verify your mobile number first!');
                return;
            }

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, otpVerified: true })
                });

                const data = await res.json();
                if (data.success) {
                    alert('✅ Account created successfully! You are now a verified user.');
                    switchTab('login');
                    document.getElementById('loginEmail').value = email;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Registration failed.');
            }
        });
    </script>
</body>

</html>
