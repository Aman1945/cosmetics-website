<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Backend API Connection Test</h1>

        <div>
            <button onclick="testProducts()">Test Products API</button>
            <button onclick="testOffers()">Test Offers API</button>
            <button onclick="testCategories()">Test Categories API</button>
        </div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${isError ? 'error' : 'success'}">${message}</div>`;
        }

        async function testProducts() {
            try {
                showStatus('Loading products...');
                const response = await fetch(`${API_URL}/products?limit=12`);
                const data = await response.json();

                if (data.success && data.data && data.data.products) {
                    showStatus(`✅ Success! Loaded ${data.data.products.length} products. Total: ${data.data.pagination.total}`);

                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <h2>Products (showing ${data.data.products.length} of ${data.data.pagination.total})</h2>
                        <div class="product-grid">
                            ${data.data.products.map(p => `
                                <div class="product-card">
                                    <img src="${p.images[0]?.url}" alt="${p.name}">
                                    <h4>${p.name}</h4>
                                    <p>₹${p.price}</p>
                                    <p>Stock: ${p.stock}</p>
                                    <p>Rating: ${p.rating?.average || 'N/A'} (${p.rating?.count || 0})</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    showStatus('❌ No products found in response', true);
                    document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
                document.getElementById('results').innerHTML = `<pre>${error.stack}</pre>`;
            }
        }

        async function testOffers() {
            try {
                showStatus('Loading offers...');
                const response = await fetch(`${API_URL}/offers`);
                const data = await response.json();

                if (data.success && data.data && data.data.offers) {
                    showStatus(`✅ Success! Loaded ${data.data.offers.length} offers`);
                    document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    showStatus('❌ No offers found', true);
                    document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
                document.getElementById('results').innerHTML = `<pre>${error.stack}</pre>`;
            }
        }

        async function testCategories() {
            try {
                showStatus('Loading categories...');
                const response = await fetch(`${API_URL}/products/categories`);
                const data = await response.json();

                if (data.success) {
                    showStatus(`✅ Success! Loaded ${data.data.categories.length} categories`);
                    document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    showStatus('❌ No categories found', true);
                    document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
                document.getElementById('results').innerHTML = `<pre>${error.stack}</pre>`;
            }
        }

        // Auto-test on load
        window.addEventListener('DOMContentLoaded', () => {
            testProducts();
        });
    </script>
</body>

</html>
